<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StreamOps — Cyber Desk Chat</title>

    <style>
        :root {
            color-scheme: dark;
            --cyan: #42c8ff;
            --blue: #1e90ff;
            --panel: rgba(5, 14, 30, 0.88);
            --border: rgba(66, 200, 255, 0.35);
            --text: #e7f4ff;
            --muted: #8ca9c7;
            --message-gap: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family:
                Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            padding: 8px;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            box-shadow:
                0 0 18px rgba(30, 144, 255, 0.12),
                inset 0 0 20px rgba(30, 144, 255, 0.035);
            backdrop-filter: blur(10px);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 42px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background:
                linear-gradient(90deg,
                    rgba(30, 144, 255, 0.15),
                    transparent 85%);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .header-mark {
            color: var(--cyan);
            font-size: 16px;
            text-shadow: 0 0 10px var(--blue);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #43ffae;
            box-shadow: 0 0 8px rgba(67, 255, 174, 0.75);
        }

        .messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: flex-end;
            gap: var(--message-gap);
            min-height: 0;
            padding: 14px;
            overflow: hidden;
        }

        .message {
            flex: 0 0 auto;
            padding: 9px 11px;
            border-left: 2px solid rgba(66, 200, 255, 0.7);
            border-radius: 0 6px 6px 0;
            background: rgba(23, 43, 69, 0.52);
            animation: message-enter 220ms ease-out both;
            overflow-wrap: anywhere;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 4px;
        }

        .username {
            color: var(--cyan);
            font-size: 13px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(66, 200, 255, 0.12);
        }

        .message-time {
            color: var(--muted);
            font-size: 10px;
            opacity: 0.8;
        }

        .message-text {
            color: var(--text);
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message-emote {
            display: inline-block;
            width: auto;
            height: 32px;
            max-width: 112px;
            margin: 0 2px;
            object-fit: contain;
            vertical-align: middle;
        }

        @keyframes message-enter {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .message {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <section class="chat-panel" aria-label="Twitch live chat">
        <header class="chat-header">
            <div class="header-title">
                <span class="header-mark">⌁</span>
                <span>Cypher SEKAI</span>
            </div>

            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>Now Live</span>
            </div>
        </header>

        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>

    <script>
        const API_URL = '/api/chat-overlay/recent';
        const POLL_INTERVAL_MS = 1000;
        const MAX_VISIBLE_MESSAGES = 12;
        const MAX_TRACKED_IDS = 500;

        const messagesElement = document.getElementById('messages');

        const seenIds = new Set();
        const seenIdOrder = [];

        let initialized = false;
        let polling = false;

        function rememberId(id) {
            if (!id || seenIds.has(id)) {
                return;
            }

            seenIds.add(id);
            seenIdOrder.push(id);

            while (seenIdOrder.length > MAX_TRACKED_IDS) {
                const oldestId = seenIdOrder.shift();
                seenIds.delete(oldestId);
            }
        }

        function validColor(color) {
            return typeof color === 'string' &&
                /^#[0-9a-f]{6}$/i.test(color)
                ? color
                : null;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);

            if (Number.isNaN(date.getTime())) {
                return '';
            }

            return date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
            });
        }

        function createMessageElement(message) {
            const article = document.createElement('article');
            article.className = 'message';

            const header = document.createElement('div');
            header.className = 'message-header';

            const username = document.createElement('span');
            username.className = 'username';
            username.textContent = message.username || 'Unknown';

            const color = validColor(message.color);

            if (color) {
                username.style.color = color;
            }

            const time = document.createElement('span');
            time.className = 'message-time';
            time.textContent = formatTime(message.timestamp);

            const text = document.createElement('div');
            text.className = 'message-text';

            if (Array.isArray(message.fragments) && message.fragments.length > 0) {
                for (const fragment of message.fragments) {
                    if (
                        fragment.type === 'emote' &&
                        typeof fragment.emoteId === 'string' &&
                        fragment.emoteId.length > 0
                    ) {
                        const emote = document.createElement('img');
                        emote.className = 'message-emote';
                        emote.src =
                            `https://static-cdn.jtvnw.net/emoticons/v2/` +
                            `${encodeURIComponent(fragment.emoteId)}/default/dark/2.0`;
                        emote.alt = fragment.text || 'Twitch emote';
                        emote.title = fragment.text || 'Twitch emote';
                        emote.loading = 'eager';
                        emote.draggable = false;

                        emote.addEventListener('error', () => {
                            console.error('[Cyber Desk Chat] Emote image failed:', {
                                name: fragment.text,
                                id: fragment.emoteId,
                                url: emote.src,
                            });

                            emote.replaceWith(
                                document.createTextNode(fragment.text || ''),
                            );
                        }, { once: true });

                        text.appendChild(emote);
                    } else {
                        text.appendChild(
                            document.createTextNode(fragment.text ?? ''),
                        );
                    }
                }
            } else {
                // Older messages stored before fragment support.
                text.textContent = message.text ?? '';
            }

            header.append(username, time);
            article.append(header, text);

            return article;
        }

        function addMessage(message) {
            messagesElement.appendChild(createMessageElement(message));

            while (
                messagesElement.children.length > MAX_VISIBLE_MESSAGES
            ) {
                messagesElement.firstElementChild.remove();
            }
        }

        async function refreshChat() {
            if (polling) {
                return;
            }

            polling = true;

            try {
                const response = await fetch(API_URL, {
                    cache: 'no-store',
                    headers: {
                        Accept: 'application/json',
                    },
                });

                if (!response.ok) {
                    throw new Error(`Chat API returned HTTP ${response.status}`);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error('Chat API response was not an array');
                }

                // Redis returns newest-first; render oldest-to-newest.
                const chronological = data
                    .filter((message) =>
                        message &&
                        typeof message.id === 'string' &&
                        typeof message.text === 'string'
                    )
                    .reverse();

                if (!initialized) {
                    // Populate the initial view without replaying animations
                    // for every message already in Redis.
                    const initialMessages = chronological.slice(
                        -MAX_VISIBLE_MESSAGES,
                    );

                    for (const message of initialMessages) {
                        addMessage(message);
                    }

                    // Remember all returned IDs, including messages not displayed.
                    for (const message of chronological) {
                        rememberId(message.id);
                    }

                    initialized = true;
                    return;
                }

                for (const message of chronological) {
                    if (seenIds.has(message.id)) {
                        continue;
                    }

                    rememberId(message.id);
                    addMessage(message);
                }
            } catch (error) {
                console.error('[Cyber Desk Chat]', error);
            } finally {
                polling = false;
            }
        }

        refreshChat();
        setInterval(refreshChat, POLL_INTERVAL_MS);
    </script>
</body>

</html>
