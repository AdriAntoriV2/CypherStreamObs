
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps - Jakarta Clock</title>

  <style>
    :root {
      color-scheme: dark;
      --cyan: #65e7ff;
      --text: #e8faff;
      --muted: #76aab9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 116px;
      padding: 12px 8px;
      gap: 5px;

      color: var(--text);
      background: rgba(5, 14, 26, 0.82);
      border: 1px solid rgba(101, 231, 255, 0.38);
      border-radius: 8px;

      box-shadow:
        0 0 14px rgba(37, 192, 255, 0.08),
        inset 0 0 14px rgba(37, 192, 255, 0.04);
    }

    .timezone {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .time {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      gap: 5px;
    }

    .digits {
      color: var(--text);
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(101, 231, 255, 0.22);
    }

    .period {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      padding-left: 3px;
    }

    .date {
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      white-space: nowrap;
      margin-top: 3px;
    }

    .accent {
      width: 28px;
      height: 2px;
      margin-top: 2px;
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(101, 231, 255, 0.65);
    }
  </style>
</head>

<body>
  <main class="clock">
    <div class="timezone">JAKARTA · UTC+7</div>

    <div class="time">
      <div class="digits" id="digits">--:--</div>
      <div class="period" id="period">--</div>
    </div>

    <div class="accent"></div>
    <div class="date" id="date">Loading...</div>
  </main>

  <script>
    const timeFormatter = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Jakarta",
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    });

    const dateFormatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Jakarta",
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

    const digits = document.getElementById("digits");
    const period = document.getElementById("period");
    const date = document.getElementById("date");

    function updateClock() {
      const now = new Date();
      const parts = Object.fromEntries(
        timeFormatter.formatToParts(now).map(part => [
          part.type,
          part.value
        ])
      );

      digits.textContent = `${parts.hour}:${parts.minute}`;
      period.textContent = parts.dayPeriod.toUpperCase();
      date.textContent = dateFormatter.format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
